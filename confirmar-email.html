<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://js.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://yumqmramxbahkfxsthtt.supabase.co https://o4511757250199552.ingest.us.sentry.io; object-src 'none'; base-uri 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="icons/favicon-32-v2.png">
<title>Meu Protocolo — Confirmar e-mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F8F9FA; --primary:#2D6BE4; --accent:#1E8C64; --text:#1E2A3A;
    --line:#E9EBEF; --card:#FFFFFF; --muted:#63707F; --font:'Inter', sans-serif;
    --card-grad:linear-gradient(165deg,#FFFFFF 0%,#F7FBF9 55%,#F6F8FE 100%);
    --danger:#C0392B; --danger-bg:#FDEDEC;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:420px; background:var(--card-grad); border:1px solid rgba(20,30,45,.05); box-shadow:0 1px 2px rgba(20,30,45,.04), 0 10px 24px -14px rgba(20,30,45,.14); border-radius:18px; padding:32px 28px; text-align:center; }
  .ico { width:52px; height:52px; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(45,107,228,.1); color:var(--primary); }
  .ico svg { width:26px; height:26px; }
  .ico.ok { background:rgba(30,140,100,.12); color:var(--accent); }
  .ico.err { background:var(--danger-bg); color:var(--danger); }
  h1 { font-size:19px; margin:0 0 10px; }
  p { font-size:14px; line-height:1.6; color:var(--muted); margin:0 0 20px; }
  .btn { display:inline-block; background:var(--primary); color:#fff; text-decoration:none; padding:12px 24px; border-radius:10px; font-weight:700; font-size:14px; }
  .spinner { width:26px; height:26px; border:3px solid rgba(45,107,228,.2); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
<script src="https://js.sentry-cdn.com/dd3ca3ee7a720284b2a9bf8240b29158.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="card" id="card">
    <div class="ico" id="ico"><div class="spinner"></div></div>
    <h1 id="title">Confirmando...</h1>
    <p id="text">Só um instante.</p>
    <div id="actions"></div>
  </div>

<script>
  var SUPABASE_URL = 'https://yumqmramxbahkfxsthtt.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1bXFtcmFteGJhaGtmeHN0aHR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NzQxNTgsImV4cCI6MjA5ODQ1MDE1OH0.7br_PYBCn1h7lUrCfpJ3VP3HOxMXmoVFyo-GTwVf3Zc';

  var ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var ICON_ERR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

  function showResult(ok, title, text) {
    document.getElementById('ico').className = 'ico ' + (ok ? 'ok' : 'err');
    document.getElementById('ico').innerHTML = ok ? ICON_OK : ICON_ERR;
    document.getElementById('title').textContent = title;
    document.getElementById('text').textContent = text;
    if (ok) document.getElementById('actions').innerHTML = '<a class="btn" href="login.html">Entrar agora</a>';
  }

  // Sem sessão/login nenhum exigido aqui de propósito — o token da URL é a
  // única credencial que importa (o aluno pode nem ter aberto o app ainda
  // nesse dispositivo). Ver escopo-ajustes-agosto2026.md, item 5.
  var token = new URLSearchParams(location.search).get('token');
  if (!token) {
    showResult(false, 'Link inválido', 'Esse link de confirmação está incompleto. Peça pro seu personal trainer gerar um novo.');
  } else {
    fetch(SUPABASE_URL + '/functions/v1/confirm-student-email-change', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ token: token }),
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (result.ok && result.data && result.data.ok) {
          showResult(true, 'E-mail confirmado!', 'Seu e-mail foi atualizado com sucesso. Faça login com o novo endereço (' + result.data.new_email + ').');
        } else {
          showResult(false, 'Não foi possível confirmar', (result.data && result.data.error) || 'Tente novamente ou peça pro seu personal gerar um novo link.');
        }
      })
      .catch(function () {
        showResult(false, 'Erro de conexão', 'Não foi possível confirmar agora. Verifique sua internet e tente de novo.');
      });
  }
</script>
</body>
</html>
