<style>
  :root {
    --bg:#F8F9FA; --primary:#2D6BE4; --accent:#1E8C64; --accent-dim:#146B4D; --text:#1E2A3A;
    --line:#E9EBEF; --card:#FFFFFF; --muted:#63707F; --faint:#94A0AF; --danger:#C0392B; --font:'Inter', sans-serif;
    --radius:14px; --radius-lg:18px;
    --card-grad:linear-gradient(165deg,#FFFFFF 0%,#F7FBF9 55%,#F6F8FE 100%);
    --shadow-card:0 1px 2px rgba(20,30,45,.04), 0 10px 24px -14px rgba(20,30,45,.14);
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--font); }
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; font-weight:700; margin:0; }
  main { max-width:720px; margin:0 auto; padding:20px 20px 90px; }
  .card { background:var(--card-grad); border:1px solid rgba(20,30,45,.04); box-shadow:var(--shadow-card); border-radius:var(--radius-lg); padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .student-item { position:relative; background:var(--card); border:1px solid rgba(20,30,45,.18); border-radius:var(--radius); box-shadow:0 3px 10px rgba(20,30,45,.09); padding:14px; margin-bottom:18px; }
  .student-item:last-child { margin-bottom:0; }
  .student-row { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; padding-right:46px; }
  .student-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .edit-fab { position:absolute; top:12px; right:12px; width:38px; height:38px; border-radius:50%; padding:0; box-shadow:0 3px 10px rgba(45,107,228,.4); z-index:2; flex-shrink:0; }
  .edit-fab svg { width:17px; height:17px; }
  .student-name-row { display:flex; align-items:center; gap:8px; }
  .student-name { font-weight:600; font-size:14px; }
  .student-email { font-size:12px; color:var(--muted); }
  .status-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .status-dot.ativo { background:var(--accent); }
  .status-dot.pausado { background:#D9A441; }
  .status-dot.inativo { background:var(--muted); }
  .notes-panel { display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .notes-panel.open { display:block; }
  .notes-panel select, .notes-panel textarea, .notes-panel input { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px; color:var(--text); font-family:var(--font); margin-bottom:8px; }
  .notes-panel textarea { min-height:70px; resize:vertical; }
  .notes-sub-label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:10px 0 6px; }
  .notes-sub-label:first-child { margin-top:0; }
  .status-hint { font-size:11.5px; color:var(--muted); line-height:1.4; margin-bottom:8px; }
  .avatar-preview { width:56px; height:56px; border-radius:50%; background:var(--primary); color:#fff; font-size:20px; font-weight:800; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:12px; }
  .avatar-preview img { width:100%; height:100%; object-fit:cover; display:block; }
  .billing-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .billing-row > * { min-width:0; }
  .billing-status { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .empty { color:var(--muted); font-size:13px; text-align:center; padding:20px 0; }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .field label { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .field input { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; color:var(--text); font-family:var(--font); }
  .field input:focus { outline:none; border-color:var(--primary); }
  .btn { padding:10px 16px; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; border:none; background:var(--primary); color:#fff; font-family:var(--font); text-decoration:none; display:inline-block; transition:transform .15s ease; }
  .btn:active { transform:scale(.97); }
  .btn.secondary { background:var(--bg); color:var(--text); border:1px solid var(--line); }
  .btn.danger { background:#FDEDEC; color:var(--danger); border:1px solid #F5C6C0; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .payment-zone { margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
  .danger-zone { margin-top:10px; padding-top:10px; border-top:1px dashed #F5C6C0; }
  .danger-zone p { font-size:12.5px; line-height:1.5; color:var(--danger); margin:0 0 10px; }
  .btn-icon { display:inline-flex; align-items:center; justify-content:center; }
  .btn-icon svg { width:15px; height:15px; }
  .msg { font-size:13px; margin-top:8px; }
  .msg.error { color:var(--danger); }
  .invite-banner{display:none;align-items:center;justify-content:space-between;gap:10px;background:rgba(30,140,100,.08);border:1px solid rgba(30,140,100,.25);border-radius:var(--radius);padding:12px 14px;margin-top:10px}
  .invite-banner-text{font-size:13px;color:var(--text);line-height:1.4}
  .invite-banner-text strong{display:block;color:var(--accent-dim);font-size:12px;margin-bottom:2px}
  .invite-banner-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .invite-banner-close{background:none;border:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:4px}
  .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#23263a; color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; z-index:999; }
  .bottom-nav { position:fixed; bottom:0; left:0; right:0; max-width:720px; margin:0 auto; height:64px; background:var(--card); border-top:1px solid var(--line); display:flex; z-index:60; }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--faint); text-decoration:none; font-family:var(--font); padding-top:6px; }
  .nav-btn .nav-ico { width:22px; height:22px; line-height:1; position:relative; }
  .nav-dot { position:absolute; top:-2px; right:-4px; width:8px; height:8px; border-radius:50%; background:var(--danger); border:2px solid var(--card); display:none; }
  .header-actions{display:flex;align-items:center;gap:8px;}
  .menu-btn{background:none;border:none;padding:6px;margin:0;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;}
  .menu-btn svg{width:22px;height:22px;}
  .drawer-overlay{position:fixed;inset:0;z-index:400;background:rgba(15,20,28,.45);display:none;opacity:0;transition:opacity .25s ease}
  .drawer-overlay.show{display:block;opacity:1}
  .side-drawer{position:fixed;top:0;right:0;bottom:0;width:80%;max-width:300px;background:var(--card);box-shadow:-10px 0 30px rgba(0,0,0,.18);z-index:401;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow-y:auto}
  .side-drawer.show{transform:translateX(0)}
  .drawer-head{padding:calc(env(safe-area-inset-top) + 20px) 18px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);flex-shrink:0}
  .drawer-head .dh-title{font-size:16px;font-weight:700;}
  .drawer-close{background:none;border:none;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px}
  .drawer-nav{padding:12px;display:flex;flex-direction:column;gap:2px}
  .drawer-item{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;padding:12px 10px;border-radius:10px;font-family:var(--font);font-size:14px;font-weight:600;color:var(--text);cursor:pointer;text-align:left;text-decoration:none}
  .drawer-item:active{background:var(--bg)}
  .drawer-item.active{color:var(--primary)}
  .drawer-item .di-ico{width:20px;height:20px;color:var(--muted);flex-shrink:0;display:flex}
  .drawer-item .di-ico svg{width:100%;height:100%}
  .drawer-item.active .di-ico{color:var(--primary)}
  .nav-btn .nav-ico svg { width:100%; height:100%; display:block; }
  .nav-btn .nav-lbl { font-size:10px; font-weight:700; }
  .nav-btn.active { color:var(--primary); }
</style>
</head>

<script>
  const SUPABASE_URL = 'https://yumqmramxbahkfxsthtt.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1bXFtcmFteGJhaGtmeHN0aHR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NzQxNTgsImV4cCI6MjA5ODQ1MDE1OH0.7br_PYBCn1h7lUrCfpJ3VP3HOxMXmoVFyo-GTwVf3Zc';
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  function openDrawer() { $('drawerOverlay').classList.add('show'); $('sideDrawer').classList.add('show'); }
  function closeDrawer() { $('drawerOverlay').classList.remove('show'); $('sideDrawer').classList.remove('show'); }
  $('drawerLogoutBtn').addEventListener('click', async () => { await supa.auth.signOut(); window.location.href = 'login.html'; });

  let professional = null;

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  function escapeHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function boot() {
    const { data: { session } } = await supa.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    const { data: pro, error } = await supa.from('professionals').select('*').eq('email', session.user.email).maybeSingle();
    if (error) { console.error('Falha ao carregar professional:', error.message); return; }
    if (!pro) { window.location.href = 'onboarding.html'; return; }

    professional = pro;
    supa.rpc('get_professional_unread_message_count').then(({ data }) => {
      $('navMsgDot').style.display = (data || 0) > 0 ? 'block' : 'none';
    });
    await loadStudents();
  }

  // Cada página do profissional (index/alunos/treinos...) é um documento
  // HTML separado — trocar de aba recarrega a página do zero, então uma
  // URL assinada guardada só em variável JS se perde a cada navegação. Sem
  // esse cache, toda vez que o painel de um aluno é reaberto (mesmo sem
  // nada ter mudado) o app pedia uma URL assinada NOVA — e como o Supabase
  // gera uma assinatura diferente a cada chamada, mesmo pro mesmo arquivo,
  // o navegador nunca reconhecia como "a mesma imagem" e baixava tudo de
  // novo. `sessionStorage` sobrevive à troca de página (só é limpo ao
  // fechar a aba), então a mesma URL assinada — e o cache HTTP da imagem
  // que vem junto dela — é reaproveitada até pouco antes de expirar de
  // verdade.
  function getCachedSignedUrl(cacheKey) {
    try {
      const raw = sessionStorage.getItem(cacheKey);
      if (!raw) return null;
      const { url, exp } = JSON.parse(raw);
      if (Date.now() < exp) return url;
    } catch {}
    return null;
  }
  function setCachedSignedUrl(cacheKey, url, ttlMs) {
    try { sessionStorage.setItem(cacheKey, JSON.stringify({ url, exp: Date.now() + ttlMs })); } catch {}
  }

  async function loadStudentAvatarPreview(studentId) {
    const el = $('avatarPreview-' + studentId);
    if (!el) return;
    const cacheKey = 'mp_avatar_url_' + studentId;
    let url = getCachedSignedUrl(cacheKey);
    if (!url) {
      const { data, error } = await supa.storage.from('student-avatars').createSignedUrl(`${studentId}/avatar.jpg`, 3600);
      if (error || !data) return;
      url = data.signedUrl;
      setCachedSignedUrl(cacheKey, url, 55 * 60 * 1000); // guarda com folga da validade real (1h)
    }
    el.innerHTML = `<img src="${url}" alt="">`;
  }

  const STATUS_LABELS = { ativo: 'Ativo', pausado: 'Pausado', inativo: 'Inativo' };
  const PLAN_STUDENT_LIMITS = { starter: 15, pro: 40, elite: Infinity };
  let notesByStudent = {};
  let currentStudentCount = 0;
  let studentsCache = [];

  async function loadStudents() {
    const { data, error } = await supa.from('students').select('*').eq('professional_id', professional.id).order('created_at', { ascending: false });
    const list = $('studentsList');
    if (error) { list.innerHTML = `<div class="empty">Erro ao carregar alunos.</div>`; return; }
    studentsCache = data || [];
    currentStudentCount = data ? data.length : 0;
    if (!data || data.length === 0) { list.innerHTML = `<div class="empty">Nenhum aluno cadastrado ainda.</div>`; return; }

    const { data: notes } = await supa.from('student_notes').select('*').eq('professional_id', professional.id);
    notesByStudent = {};
    (notes || []).forEach(n => { notesByStudent[n.student_id] = n; });

    list.innerHTML = data.map(s => {
      const note = notesByStudent[s.id] || { nota: '' };
      return `
      <div class="student-item">
        <button class="btn btn-icon edit-fab" data-role="toggle-notes" data-student-id="${s.id}" title="Editar aluno" aria-label="Editar aluno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        <div class="student-row">
          <div class="student-name-row">
            <span class="status-dot ${s.status}" title="${STATUS_LABELS[s.status]}"></span>
            <div>
              <div class="student-name">${escapeHtml(s.nome)}</div>
              <div class="student-email">${escapeHtml(s.email)}</div>
            </div>
          </div>
          <div class="student-actions">
            <a class="btn secondary" style="padding:7px 12px;font-size:12px;" href="treinos.html?student_id=${s.id}">Treino</a>
            <a class="btn secondary" style="padding:7px 12px;font-size:12px;" href="avaliacoes.html?student_id=${s.id}">Avaliação</a>
            <a class="btn secondary" style="padding:7px 12px;font-size:12px;" href="nutri.html?student_id=${s.id}">Nutri</a>
            <button class="btn secondary btn-icon" style="padding:7px 10px;" data-role="toggle-msg" data-student-id="${s.id}" title="Enviar mensagem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
          </div>
        </div>
        <div class="notes-panel" id="msgPanel-${s.id}">
          <div class="notes-sub-label">Enviar mensagem</div>
          <textarea data-role="msg-text" data-student-id="${s.id}" placeholder="Escreva uma mensagem para ${escapeHtml(s.nome)}..."></textarea>
          <button class="btn small" style="padding:7px 12px;font-size:12px;" data-role="send-msg" data-student-id="${s.id}">Enviar</button>
          <div class="msg" id="msgSendStatus-${s.id}"></div>
        </div>
        <div class="notes-panel" id="notesPanel-${s.id}">
          <div class="avatar-preview" id="avatarPreview-${s.id}">${escapeHtml((s.nome || '?').trim().charAt(0).toUpperCase())}</div>

          <div class="notes-sub-label">Status<button type="button" class="help-q-btn" aria-label="Ajuda" onclick="showHelpBanner('O que cada status faz', '<strong>Ativo</strong> é o normal, sem restrição.<br><br><strong>Pausado</strong> é só uma marcação sua — não muda nada pro aluno, ele continua acessando o app normalmente; útil pra organizar quem está temporariamente fora sem perder o controle.<br><br><strong>Inativo</strong> bloqueia o acesso de verdade — o aluno vê um aviso pra falar com você e não consegue mais usar o app, mas os dados dele continuam guardados até você decidir excluir.')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button></div>
          <div class="status-hint">Inativo bloqueia o acesso do aluno de verdade — ele vê um aviso pra falar com você e não consegue mais usar o app. Pausado é só organização sua, não bloqueia nada. Muda na hora, sem precisar de "Salvar edição".</div>
          <select data-role="note-status" data-student-id="${s.id}" data-prev-status="${s.status}">
            ${Object.entries(STATUS_LABELS).map(([v, l]) => `<option value="${v}" ${s.status === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select>

          <div class="notes-sub-label">Editar dados do aluno</div>
          <textarea data-role="note-text" data-student-id="${s.id}" placeholder="Nota privada sobre esse aluno (só você vê)...">${escapeHtml(note.nota || '')}</textarea>
          <div style="display:flex;gap:6px;">
            <input type="tel" data-role="telefone" data-student-id="${s.id}" placeholder="WhatsApp com DDD e país, ex: 5511999999999" value="${escapeHtml(s.telefone || '')}" style="flex:1;min-width:0;">
            <button class="btn small secondary" style="padding:7px 10px;font-size:11.5px;white-space:nowrap;flex-shrink:0;" data-role="copy-invite" data-student-id="${s.id}" data-name="${escapeHtml(s.nome)}" title="Abrir convite no WhatsApp (ou copiar o link, se não tiver WhatsApp cadastrado)">Enviar convite</button>
          </div>
          <select data-role="genero" data-student-id="${s.id}">
            <option value="" ${!s.genero ? 'selected' : ''}>Gênero: prefiro não informar</option>
            <option value="M" ${s.genero === 'M' ? 'selected' : ''}>Gênero: Masculino</option>
            <option value="F" ${s.genero === 'F' ? 'selected' : ''}>Gênero: Feminino</option>
          </select>
          <div class="billing-row">
            <input type="number" step="0.01" data-role="mensalidade-valor" data-student-id="${s.id}" placeholder="Valor da mensalidade (R$)" value="${s.mensalidade_valor ?? ''}">
            <input type="number" min="1" max="31" data-role="mensalidade-dia" data-student-id="${s.id}" placeholder="Dia venc. (1-31)" value="${s.mensalidade_dia_vencimento ?? ''}">
          </div>
          <button class="btn small" style="padding:7px 12px;font-size:12px;" data-role="save-edit" data-student-id="${s.id}">Salvar edição</button>
          <div class="msg" id="editSaveMsg-${s.id}"></div>

          <div class="payment-zone">
            <div class="notes-sub-label">Pagamento</div>
            <div class="billing-status">${s.ultimo_pagamento_em ? `Último pagamento: ${new Date(s.ultimo_pagamento_em + 'T00:00:00').toLocaleDateString('pt-BR')}` : 'Nenhum pagamento registrado ainda'}</div>
            <button class="btn small secondary" style="padding:7px 12px;font-size:12px;" data-role="mark-paid" data-student-id="${s.id}">Marcar pago hoje</button>
          </div>

          <div class="danger-zone" id="dangerZone-${s.id}" style="display:${s.status === 'inativo' ? 'block' : 'none'};">
            <div id="deleteStep1-${s.id}">
              <button class="btn danger" style="padding:7px 12px;font-size:12px;" data-role="open-delete" data-student-id="${s.id}">Excluir aluno</button>
            </div>
            <div id="deleteStep2-${s.id}" style="display:none;">
              <p><strong>Isso apaga ${escapeHtml(s.nome)} permanentemente</strong> — treinos, avaliações, mensagens e histórico de nutrição, sem período de retenção. Não pode ser desfeito.</p>
              <div style="display:flex;gap:8px;">
                <button class="btn secondary" style="flex:1;padding:7px 12px;font-size:12px;" data-role="cancel-delete" data-student-id="${s.id}">Cancelar</button>
                <button class="btn danger" style="flex:1;padding:7px 12px;font-size:12px;" data-role="confirm-delete" data-student-id="${s.id}">Confirmar exclusão</button>
              </div>
              <div class="msg error" id="deleteMsg-${s.id}"></div>
            </div>
          </div>
        </div>
      </div>
    `; }).join('');

    const avatarLoaded = {};
    list.querySelectorAll('[data-role="toggle-msg"]').forEach(btn => {
      btn.addEventListener('click', () => {
        $('msgPanel-' + btn.dataset.studentId).classList.toggle('open');
      });
    });
    list.querySelectorAll('[data-role="send-msg"]').forEach(btn => {
      btn.addEventListener('click', () => sendMessageToStudent(btn.dataset.studentId));
    });
    list.querySelectorAll('[data-role="toggle-notes"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const studentId = btn.dataset.studentId;
        const panel = $('notesPanel-' + studentId);
        const opening = !panel.classList.contains('open');
        panel.classList.toggle('open');
        if (opening && !avatarLoaded[studentId]) {
          avatarLoaded[studentId] = true;
          loadStudentAvatarPreview(studentId);
        }
      });
    });
    list.querySelectorAll('[data-role="save-edit"]').forEach(btn => {
      btn.addEventListener('click', () => saveStudentEdit(btn.dataset.studentId));
    });
    list.querySelectorAll('[data-role="mark-paid"]').forEach(btn => {
      btn.addEventListener('click', () => markPaid(btn.dataset.studentId));
    });
    list.querySelectorAll('[data-role="copy-invite"]').forEach(btn => {
      btn.addEventListener('click', () => sendInvite(btn.dataset.studentId, btn.dataset.name));
    });
    list.querySelectorAll('[data-role="note-status"]').forEach(sel => {
      sel.addEventListener('change', () => updateStudentStatus(sel));
    });
    list.querySelectorAll('[data-role="open-delete"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const studentId = btn.dataset.studentId;
        $('deleteStep1-' + studentId).style.display = 'none';
        $('deleteStep2-' + studentId).style.display = 'block';
      });
    });
    list.querySelectorAll('[data-role="cancel-delete"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const studentId = btn.dataset.studentId;
        $('deleteStep2-' + studentId).style.display = 'none';
        $('deleteStep1-' + studentId).style.display = 'block';
      });
    });
    list.querySelectorAll('[data-role="confirm-delete"]').forEach(btn => {
      btn.addEventListener('click', () => deleteStudent(btn.dataset.studentId));
    });
  }

  async function deleteStudent(studentId) {
    const btn = document.querySelector(`[data-role="confirm-delete"][data-student-id="${studentId}"]`);
    const msgEl = $('deleteMsg-' + studentId);
    btn.disabled = true;
    msgEl.textContent = '';
    // Cancela a cobrança automática (se houver) antes de excluir — sem isso,
    // o Mercado Pago continuaria tentando cobrar o cartão de um aluno já
    // excluído. Melhor esforço: falha aqui não deve impedir a exclusão.
    await supa.functions.invoke('mercadopago-cancel-student-charge', { body: { student_id: studentId } }).catch(() => {});
    const { error } = await supa.from('students').delete().eq('id', studentId);
    btn.disabled = false;
    if (error) {
      msgEl.textContent = 'Erro ao excluir: ' + error.message;
      return;
    }
    toast('Aluno excluído.');
    await loadStudents();
  }

  async function sendMessageToStudent(studentId) {
    const textarea = document.querySelector(`[data-role="msg-text"][data-student-id="${studentId}"]`);
    const body = textarea.value.trim();
    const statusEl = $('msgSendStatus-' + studentId);
    if (!body) return;

    const btn = document.querySelector(`[data-role="send-msg"][data-student-id="${studentId}"]`);
    btn.disabled = true;
    statusEl.textContent = '';
    statusEl.className = 'msg';
    const { error } = await supa.rpc('send_message', { p_student_id: studentId, p_body: body });
    btn.disabled = false;

    if (error) {
      statusEl.textContent = 'Erro ao enviar: ' + error.message;
      statusEl.className = 'msg error';
      return;
    }
    textarea.value = '';
    statusEl.textContent = 'Mensagem enviada — veja a resposta na aba Mensagens.';
    toast('Mensagem enviada.');
  }

  // Um único botão salva tudo do painel de edição (nota privada + WhatsApp +
  // gênero + mensalidade) numa tacada só — antes eram 2 botões separados
  // ("Salvar nota" e "Salvar WhatsApp/mensalidade") e o usuário reportou
  // confusão real: editava um campo, clicava no botão errado, achava que
  // tinha salvo e não tinha. Status continua fora daqui de propósito — já é
  // controle de acesso de verdade, salva sozinho na hora que muda (ver
  // updateStudentStatus), nunca deveria esperar esse botão.
  async function saveStudentEdit(studentId) {
    const btn = document.querySelector(`[data-role="save-edit"][data-student-id="${studentId}"]`);
    const msgEl = $('editSaveMsg-' + studentId);
    btn.disabled = true;
    msgEl.textContent = '';
    msgEl.className = 'msg';

    const nota = document.querySelector(`[data-role="note-text"][data-student-id="${studentId}"]`).value.trim();
    const telefone = document.querySelector(`[data-role="telefone"][data-student-id="${studentId}"]`).value.replace(/\D/g, '');
    const genero = document.querySelector(`[data-role="genero"][data-student-id="${studentId}"]`).value;
    const valorRaw = document.querySelector(`[data-role="mensalidade-valor"][data-student-id="${studentId}"]`).value;
    const diaRaw = document.querySelector(`[data-role="mensalidade-dia"][data-student-id="${studentId}"]`).value;

    const notePayload = { professional_id: professional.id, student_id: studentId, nota };
    const existingNote = notesByStudent[studentId];
    const noteResult = existingNote
      ? await supa.from('student_notes').update(notePayload).eq('id', existingNote.id)
      : await supa.from('student_notes').insert(notePayload);

    const studentsPayload = {
      telefone: telefone || null,
      genero: genero || null,
      mensalidade_valor: valorRaw ? parseFloat(valorRaw) : null,
      mensalidade_dia_vencimento: diaRaw ? parseInt(diaRaw, 10) : null,
    };
    const studentsResult = await supa.from('students').update(studentsPayload).eq('id', studentId);

    btn.disabled = false;
    if (noteResult.error || studentsResult.error) {
      msgEl.textContent = 'Erro ao salvar: ' + (noteResult.error?.message || studentsResult.error?.message);
      msgEl.className = 'msg error';
      return;
    }

    // Se o aluno já tem cobrança automática por cartão ativa, sincroniza o
    // valor novo com o Mercado Pago (lacuna 4 do desenho de cobrança
    // automática) — sem isso, o cartão continuaria sendo cobrado no valor
    // antigo. Melhor esforço: não bloqueia o salvamento local se falhar.
    const student = studentsCache?.find(s => s.id === studentId);
    if (student?.mp_charge_method === 'cartao' && studentsPayload.mensalidade_valor) {
      supa.functions.invoke('mercadopago-update-student-charge', {
        body: { student_id: studentId, novo_valor: studentsPayload.mensalidade_valor },
      }).then(({ data, error: syncErr }) => {
        if (syncErr || data?.error) toast('Edição salva, mas falhou ao sincronizar mensalidade com o Mercado Pago: ' + (data?.error || syncErr?.message));
      }).catch(() => {});
    }

    toast('Edição salva.');
    // Dropup: fecha o painel de edição na hora, sem esperar o reload da
    // lista terminar — feedback imediato de que salvou e recolheu.
    const panel = $('notesPanel-' + studentId);
    if (panel) panel.classList.remove('open');
    await loadStudents();
  }

  // Link fixo pra mandar pro aluno novo (landing-aluno.html é genérica, sem
  // personalização por profissional — mesma URL serve pra qualquer aluno).
  // Com WhatsApp já cadastrado, abre direto a conversa (mesmo padrão wa.me
  // já usado em index.html pros alertas de adesão/pagamento). Sem WhatsApp
  // cadastrado, cai pra copiar o link puro — nada pra abrir ainda.
  function firstName(nome) { return (nome || '').trim().split(' ')[0]; }

  async function sendInvite(studentId, nome) {
    const link = 'https://meuprotocolo.app/landing-aluno.html';
    const telefone = document.querySelector(`[data-role="telefone"][data-student-id="${studentId}"]`).value.replace(/\D/g, '');
    if (telefone) {
      const msg = `Oi ${firstName(nome)}! Vou te acompanhar pelo Meu Protocolo — entra por aqui pra começar: ${link}`;
      window.open(`https://wa.me/${telefone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
      return;
    }
    try {
      await navigator.clipboard.writeText(link);
      toast('Sem WhatsApp cadastrado — link copiado, cole onde preferir.');
    } catch {
      toast('Não foi possível copiar automaticamente: ' + link);
    }
  }

  async function markPaid(studentId) {
    const { error } = await supa.from('students').update({ ultimo_pagamento_em: todayISO() }).eq('id', studentId);
    if (error) { toast('Erro ao marcar pagamento: ' + error.message); return; }
    toast('Pagamento registrado.');
    await loadStudents();
  }

  function todayISO() { return new Date().toISOString().slice(0, 10); }

  // Status agora é controle de acesso de verdade (não só organização) —
  // salva na hora, sem esperar o botão "Salvar edição", pra nunca dar a
  // impressão de que "Inativo" já bloqueou o aluno quando na real ainda
  // não foi salvo.
  async function updateStudentStatus(sel) {
    const studentId = sel.dataset.studentId;
    const newStatus = sel.value;
    const previousStatus = sel.dataset.prevStatus || 'ativo';
    sel.disabled = true;
    const { error } = await supa.from('students').update({ status: newStatus }).eq('id', studentId);
    sel.disabled = false;
    if (error) {
      sel.value = previousStatus;
      toast('Erro ao salvar status: ' + error.message);
      return;
    }
    sel.dataset.prevStatus = newStatus;
    $('dangerZone-' + studentId).style.display = newStatus === 'inativo' ? 'block' : 'none';
    // Marcar Inativo também cancela a cobrança automática desse aluno (lacuna
    // 3 do desenho de cobrança automática) — sem isso o app continuaria
    // tentando cobrar o cartão de alguém já bloqueado. Melhor esforço, não
    // trava o resto do fluxo se falhar.
    if (newStatus === 'inativo') {
      supa.functions.invoke('mercadopago-cancel-student-charge', { body: { student_id: studentId } }).catch(() => {});
    }
    toast(newStatus === 'inativo' ? 'Acesso do aluno bloqueado — ele vê um aviso pra falar com você.' : 'Status atualizado.');
  }

  $('addStudentBtn').addEventListener('click', async () => {
    const nome = $('newStudentName').value.trim();
    const email = $('newStudentEmail').value.trim().toLowerCase();
    $('addStudentMsg').textContent = '';
    if (!nome || !email || !email.includes('@')) {
      $('addStudentMsg').textContent = 'Preencha nome e e-mail válidos.';
      return;
    }
    const limite = PLAN_STUDENT_LIMITS[professional.plan] ?? PLAN_STUDENT_LIMITS.starter;
    if (currentStudentCount >= limite) {
      $('addStudentMsg').innerHTML = `Seu plano (${escapeHtml(professional.plan)}) permite até ${limite} alunos. <a href="perfil.html#planCard" style="color:var(--primary);font-weight:700;">Fazer upgrade</a>`;
      return;
    }
    const telefone = $('newStudentTelefone').value.replace(/\D/g, '') || null;
    const genero = $('newStudentGenero').value || null;
    const mensalidadeValor = $('newStudentMensalidadeValor').value ? Number($('newStudentMensalidadeValor').value) : null;
    const mensalidadeDia = $('newStudentMensalidadeDia').value ? Number($('newStudentMensalidadeDia').value) : null;

    $('addStudentBtn').disabled = true;
    const { data: newStudent, error } = await supa.from('students').insert({
      professional_id: professional.id,
      nome,
      email,
      telefone,
      genero,
      mensalidade_valor: mensalidadeValor,
      mensalidade_dia_vencimento: mensalidadeDia,
    }).select().single();
    $('addStudentBtn').disabled = false;
    if (error) {
      $('addStudentMsg').textContent = 'Erro: ' + error.message;
      return;
    }
    $('newStudentName').value = '';
    $('newStudentEmail').value = '';
    $('newStudentTelefone').value = '';
    $('newStudentGenero').value = '';
    $('newStudentMensalidadeValor').value = '';
    $('newStudentMensalidadeDia').value = '';
    await loadStudents();
    showInviteBanner(newStudent.id, nome, telefone);
    window.__checkAssistantHint && window.__checkAssistantHint();
  });

  // Substitui o toast antigo "Aluno criado" — dá pra fechar e mandar o
  // convite depois (pelo botão "Enviar convite" que já existe na lista) ou
  // já disparar na hora, reaproveitando o mesmo sendInvite() de lá.
  function showInviteBanner(studentId, nome, telefone) {
    $('inviteBannerDetail').textContent = telefone
      ? `WhatsApp: ${telefone}`
      : 'Sem WhatsApp cadastrado — o convite vai como link pra copiar.';
    $('inviteBannerSendBtn').onclick = () => { sendInvite(studentId, nome); hideInviteBanner(); };
    $('inviteBanner').style.display = 'flex';
  }
  function hideInviteBanner() { $('inviteBanner').style.display = 'none'; }
  $('inviteBannerCloseBtn').addEventListener('click', hideInviteBanner);

    boot();
</script>
</body>
</html>
